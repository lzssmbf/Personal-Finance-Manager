<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Finance Manager</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finance" />
  <style>
    :root{
      --bg:#f8fafc;
      --panel:#ffffff;
      --soft:#f1f5f9;
      --border:#e2e8f0;
      --text:#0f172a;
      --muted:#64748b;
      --blue:#2563eb;
      --indigo:#4f46e5;
      --green:#16a34a;
      --red:#ef4444;
      --amber:#f59e0b;
      --purple:#8b5cf6;
      --shadow:0 10px 25px rgba(15, 23, 42, 0.08);
    }

    *{box-sizing:border-box}
    html, body{
      margin:0;
      height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body{
      min-height:100vh;
      padding:18px;
    }
    .app{
      max-width:1100px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .header{
      background:rgba(255,255,255,0.9);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .brand-icon{
      width:46px;height:46px;border-radius:16px;
      background:linear-gradient(135deg,var(--blue),var(--indigo));
      display:flex;align-items:center;justify-content:center;
      color:white;font-weight:900;font-size:22px;
      box-shadow:0 12px 22px rgba(37,99,235,0.26);
    }
    .title{
      font-weight:900;font-size:clamp(1.2rem, 2vw, 2rem);
      letter-spacing:-0.03em;
    }
    .subtitle{
      font-size:0.76rem;color:var(--muted);
      font-weight:600;
    }
    .month-box{
      background:var(--soft);
      border:1px solid var(--border);
      border-radius:14px;
      padding:8px 10px;
      display:flex;align-items:center;gap:8px;
      font-weight:700;
      color:var(--text);
    }
    input[type="month"], input, select, button{
      font:inherit;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(5, minmax(0, 1fr));
      gap:12px;
    }
    .stat{
      background:white;
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:14px 16px;
      display:flex;align-items:center;gap:12px;
      min-height:90px;
    }
    .stat-icon{
      width:44px;height:44px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      font-weight:900; font-size:18px;
    }
    .stat-label{
      font-size:10px;font-weight:800;letter-spacing:0.12em;
      text-transform:uppercase;color:var(--muted);
    }
    .stat-value{
      font-size:clamp(1rem,2vw,1.5rem);
      font-weight:900; letter-spacing:-0.04em;
      margin-top:4px;
    }
    .blue{background:#dbeafe;color:#1d4ed8}
    .green{background:#dcfce7;color:#15803d}
    .amber{background:#fef3c7;color:#b45309}
    .red{background:#fee2e2;color:#b91c1c}
    .indigo{background:#e0e7ff;color:#4338ca}

    .panel{
      background:white;
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:18px;
    }

    .section-title{
      font-size:1.05rem;
      font-weight:900;
      margin-bottom:12px;
      display:flex;align-items:center;gap:8px;
    }
    .calendar-wrap{
      display:flex;flex-direction:column;gap:12px;
    }
    .calendar-legend{
      display:flex;flex-wrap:wrap;gap:8px;font-size:11px;font-weight:700;color:var(--muted);
    }
    .legend-item{
      display:flex;align-items:center;gap:6px;background:var(--soft);
      border:1px solid var(--border);border-radius:999px;padding:5px 8px;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;display:inline-block;
    }

    .calendar{
      display:grid;
      grid-template-columns:repeat(7, minmax(0,1fr));
      gap:8px;
    }
    .day-name{
      text-align:center;
      font-size:11px;
      font-weight:900;
      color:var(--muted);
      letter-spacing:0.1em;
      text-transform:uppercase;
      padding:4px 0;
    }
    .calendar-day{
      position:relative;
      min-height:70px;
      border-radius:18px;
      border:1px solid var(--border);
      background:var(--soft);
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;
      cursor:pointer;
      transition:0.15s ease;
      user-select:none;
      padding:4px 6px;
    }
    .calendar-day:hover{transform:translateY(-1px)}
    .calendar-day.empty{background:transparent;border:none;cursor:default}
    .day-number{font-size:1rem;font-weight:800}
    .day-tag{font-size:9px;font-weight:800}
    .day-absent{background:var(--red);color:white;border-color:var(--red)}
    .day-half{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
    .day-full{background:#dcfce7;color:#166534;border-color:#bbf7d0}
    .day-off{background:#f8fafc;color:#94a3b8;border-color:#e2e8f0;cursor:default}
    .ot-badge{
      position:absolute;top:6px;right:8px;
      background:#fbbf24;color:#7c2d12;
      border-radius:999px;padding:2px 5px;
      font-size:8px;font-weight:900;
      border:1px solid rgba(0,0,0,0.04);
    }

    .main-grid{
      display:grid;
      grid-template-columns:1.2fr 0.8fr;
      gap:16px;
    }
    .salary-box{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .money-list{
      display:flex;flex-direction:column;gap:10px;
    }
    .money-row{
      display:flex;justify-content:space-between;align-items:center;
      color:var(--muted);font-size:0.86rem;font-weight:700;
      padding:8px 0;border-bottom:1px solid var(--border);
    }
    .money-row strong{color:var(--text)}
    .money-row.income span:last-child{color:var(--green)}
    .money-row.expense span:last-child{color:var(--red)}
    .money-row.total{
      padding-top:10px;border-bottom:none;font-size:1rem;font-weight:900;color:var(--text)
    }

    .audit-box{
      background:var(--soft);
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px;
    }
    .audit-title{
      font-size:12px;font-weight:900; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);
      margin-bottom:8px;
    }
    .audit-row{
      display:flex;justify-content:space-between;gap:10px;
      font-size:0.8rem;
      color:var(--muted);font-weight:700;
      padding:6px 0;
      border-bottom:1px dashed var(--border);
    }
    .audit-row strong{color:var(--text)}

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
    }
    .field{
      display:flex;flex-direction:column;gap:6px;
    }
    .field label{
      font-size:10px;font-weight:900;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;
    }
    .field input, .field select{
      width:100%;
      border:1px solid var(--border);
      background:var(--soft);
      color:var(--text);
      border-radius:12px;
      padding:11px 12px;
      font-weight:700;
      transition:0.15s ease;
    }
    .field input:focus, .field select:focus{
      outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,0.12);
    }
    .full{
      grid-column:1 / -1;
    }
    .primary-btn{
      width:100%;
      border:none;border-radius:14px;
      background:linear-gradient(135deg,var(--blue),var(--indigo));
      color:white;font-weight:900;
      padding:13px 16px;
      box-shadow:0 12px 20px rgba(37,99,235,0.22);
      cursor:pointer;
    }
    .primary-btn:hover{filter:brightness(1.03)}

    .transaction-list{
      display:flex;flex-direction:column;gap:10px;
      max-height:440px;overflow:auto;
      padding-right:4px;
    }
    .tx{
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;
      background:var(--soft);
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
    }
    .tx-left{
      display:flex;align-items:center;gap:10px;
      min-width:0;
      flex:1;
    }
    .tx-icon{
      width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      font-size:18px;font-weight:900;
    }
    .tx-income{background:#dcfce7;color:#166534}
    .tx-expense{background:#fee2e2;color:#991b1b}
    .tx-info{min-width:0;flex:1}
    .tx-name{
      font-weight:900;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .tx-meta{
      font-size:11px;color:var(--muted);font-weight:700;display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;
    }
    .tx-amount{
      font-weight:900;font-size:0.95rem;white-space:nowrap;
    }
    .tx-income-text{color:var(--green)}
    .tx-expense-text{color:var(--red)}
    .delete-btn{
      border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:6px 8px;border-radius:10px;
    }
    .delete-btn:hover{background:#fee2e2;color:var(--red)}

    .modal{
      position:fixed;inset:0;background:rgba(15, 23, 42, 0.45);display:none;align-items:center;justify-content:center;padding:18px;
      z-index:1000;
    }
    .modal.show{display:flex}
    .modal-card{
      background:white;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);
      width:min(420px,100%);padding:18px;
    }
    .modal-head{
      display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;
    }
    .close-btn{
      border:none;background:var(--soft);width:34px;height:34px;border-radius:10px;font-size:22px;cursor:pointer;color:var(--muted);
    }
    .modal-actions{
      display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;margin-top:12px;
    }
    .mini-btn{
      padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--soft);font-weight:800;color:var(--text);cursor:pointer;
    }
    .mini-btn.active{
      background:var(--blue);border-color:var(--blue);color:white;
    }
    .mini-btn.orange{
      background:#fff7ed;border-color:#fdba74;color:#b45309;
    }
    .mini-btn.green{
      background:#dcfce7;border-color:#86efac;color:#166534;
    }
    .mini-btn.red{
      background:#fee2e2;border-color:#fca5a5;color:#991b1b;
    }
    .custom-amount{
      display:none;
      margin-top:10px;
    }
    .custom-amount.show{display:block}
    .small-note{
      font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;
    }

    @media (max-width: 900px){
      .stats{grid-template-columns:repeat(2, minmax(0,1fr));}
      .main-grid{grid-template-columns:1fr;}
    }

    @media (max-width: 520px){
      body{padding:14px}
      .header{padding:14px}
      .panel{padding:14px}
      .form-grid{grid-template-columns:1fr}
      .salary-box{grid-template-columns:1fr}
      .stats{grid-template-columns:1fr}
      .calendar-day{min-height:64px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">$</div>
        <div>
          <div class="title">Finance Manager</div>
          <div class="subtitle">Personal budget + work schedule</div>
        </div>
      </div>

      <div class="month-box">
        <span>📅</span>
        <input id="monthInput" type="month" />
      </div>
    </header>

    <section class="stats" id="statsCards"></section>

    <div class="main-grid">
      <section class="panel">
        <div class="calendar-wrap">
          <div class="section-title">📆 Work Calendar</div>
          <div class="calendar-legend">
            <span class="legend-item"><span class="dot" style="background:#60a5fa"></span> Half day</span>
            <span class="legend-item"><span class="dot" style="background:#4ade80"></span> Full day</span>
            <span class="legend-item"><span class="dot" style="background:#ef4444"></span> Absent</span>
            <span class="legend-item"><span class="dot" style="background:#fbbf24"></span> Overtime</span>
          </div>
          <div id="calendar" class="calendar"></div>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">💰 Salary Math</div>
        <div class="salary-box">
          <div class="money-list" id="salaryBreakdown"></div>
          <div class="audit-box">
            <div class="audit-title">Details</div>
            <div id="auditInfo"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="main-grid">
      <section class="panel">
        <div class="section-title">➕ Add entry</div>
        <form id="txForm">
          <div class="form-grid">
            <div class="field">
              <label>Type</label>
              <select id="txType">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>

            <div class="field">
              <label>Category</label>
              <select id="txCategory"></select>
            </div>

            <div class="field">
              <label>Date</label>
              <input id="txDate" type="date" />
            </div>

            <div class="field">
              <label>Amount</label>
              <input id="txAmount" type="number" min="0" step="1" placeholder="0" />
            </div>

            <div class="field full">
              <label>Description</label>
              <input id="txDescription" type="text" placeholder="Example: Groceries, freelance project, bus ticket..." />
            </div>

            <div class="full">
              <button class="primary-btn" type="submit">Save entry</button>
            </div>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="section-title">📋 Transaction list</div>
        <div id="txList" class="transaction-list"></div>
      </section>
    </div>
  </div>

  <div id="dayModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalDate" style="margin:0;font-weight:900;font-size:1.05rem"></h3>
        <button class="close-btn" type="button" id="closeModal">×</button>
      </div>

      <div class="modal-actions">
        <button class="mini-btn green" type="button" id="markPresent">Present</button>
        <button class="mini-btn red" type="button" id="markAbsent">Absent</button>
      </div>

      <div style="margin-top:14px">
        <div style="font-size:10px;font-weight:900;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px">Overtime</div>
        <div class="modal-actions">
          <button class="mini-btn orange" type="button" data-ot="none">None</button>
          <button class="mini-btn orange" type="button" data-ot="half">Half</button>
          <button class="mini-btn orange" type="button" data-ot="full">Full</button>
          <button class="mini-btn active" type="button" data-ot="custom">Custom</button>
        </div>

        <div id="customAmountWrap" class="custom-amount">
          <input id="customAmountInput" type="number" min="0" step="1" placeholder="NT$ amount" style="width:100%; border:1px solid var(--border); background:var(--soft); padding:11px 12px; border-radius:12px; font-weight:700" />
        </div>
      </div>

      <div class="small-note" id="modalNote"></div>

      <div style="margin-top:16px">
        <button class="primary-btn" id="saveDayBtn" type="button">Save day</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "finance_manager_data_v1";

    const defaultState = {
      baseSalary: 32000,
      rentAllowance: 5000,
      transportAllowance: 1200,
      healthInsuranceAllowance: 400,
      currentMonth: getDefaultMonth(),
      records: {},
      transactions: []
    };

    let state = loadState();

    const expenseCategories = [
      "Food & Dining",
      "Education",
      "Transportation",
      "Shopping",
      "Utilities & Bills",
      "Entertainment",
      "Healthcare",
      "Misc"
    ];
    const incomeCategories = [
      "Freelance & Side Work",
      "Investments",
      "Selling Items",
      "Bonus / Gift",
      "Other Income"
    ];

    const categoryColors = {
      "Food & Dining": "bg-amber-500",
      "Education": "bg-indigo-500",
      "Transportation": "bg-blue-500",
      "Shopping": "bg-pink-500",
      "Utilities & Bills": "bg-purple-500",
      "Entertainment": "bg-emerald-500",
      "Healthcare": "bg-rose-500",
      "Misc": "bg-slate-400"
    };

    const monthInput = document.getElementById("monthInput");
    const statsCards = document.getElementById("statsCards");
    const calendarEl = document.getElementById("calendar");
    const salaryBreakdown = document.getElementById("salaryBreakdown");
    const auditInfo = document.getElementById("auditInfo");
    const txList = document.getElementById("txList");
    const txForm = document.getElementById("txForm");
    const txType = document.getElementById("txType");
    const txCategory = document.getElementById("txCategory");
    const txDate = document.getElementById("txDate");
    const txAmount = document.getElementById("txAmount");
    const txDescription = document.getElementById("txDescription");

    function getDefaultMonth() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        const saved = JSON.parse(raw);
        return {
          ...JSON.parse(JSON.stringify(defaultState)),
          ...saved,
          records: saved.records || {},
          transactions: saved.transactions || []
        };
      } catch {
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

    function formatMoney(v) {
      return "NT$" + Number(v || 0).toLocaleString();
    }

    function getActiveCategoryOptions() {
      const selected = txType.value;
      return selected === "income" ? incomeCategories : expenseCategories;
    }

    function populateCategories() {
      const options = getActiveCategoryOptions();
      txCategory.innerHTML = "";
      options.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        txCategory.appendChild(opt);
      });
    }

    function monthInfo(month) {
      const [y, m] = month.split("-").map(Number);
      const daysInMonth = new Date(y, m, 0).getDate();
      const firstDayIndex = new Date(y, m - 1, 1).getDay();
      const totalFDE = (() => {
        let half = 0;
        let full = 0;
        for (let d = 1; d <= daysInMonth; d++) {
          const dayNum = new Date(y, m - 1, d).getDay();
          if ([1, 2, 3].includes(dayNum)) half++;
          else if ([0, 5, 6].includes(dayNum)) full++;
        }
        return half * 0.5 + full;
      })();

      const fullRate = totalFDE > 0 ? state.baseSalary / totalFDE : 0;
      const halfRate = fullRate / 2;

      return { y, m, daysInMonth, firstDayIndex, totalFDE, fullRate, halfRate };
    }

    function getMonthTransactions(month) {
      return state.transactions.filter(tx => tx.date.startsWith(month));
    }

    function computeValuesForMonth(month) {
      const info = monthInfo(month);
      const totalDeductions = Object.keys(state.records || {})
        .filter(date => date.startsWith(month))
        .reduce((sum, date) => {
          const rec = state.records[date] || {};
          if (rec.absent) {
            const day = new Date(date).getDay();
            if ([1,2,3].includes(day)) return sum + info.halfRate;
            if ([0,5,6].includes(day)) return sum + info.fullRate;
          }
          return sum;
        }, 0);

      const overtimeTotal = Object.keys(state.records || {})
        .filter(date => date.startsWith(month))
        .reduce((sum, date) => {
          const rec = state.records[date] || {};
          const overtime = Number(rec.overtime || 0);
          return sum + overtime;
        }, 0);

      const jobSalary = (state.baseSalary - totalDeductions) + state.rentAllowance + state.transportAllowance + state.healthInsuranceAllowance + overtimeTotal;

      const monthTx = getMonthTransactions(month);
      const incomeTotal = monthTx.filter(tx => tx.type === "income").reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
      const expenseTotal = monthTx.filter(tx => tx.type === "expense").reduce((sum, tx) => sum + Number(tx.amount || 0), 0);

      const net = (jobSalary + incomeTotal) - expenseTotal;

      return {
        ...info,
        totalDeductions,
        overtimeTotal,
        jobSalary,
        incomeTotal,
        expenseTotal,
        net
      };
    }

    function renderStats() {
      const values = computeValuesForMonth(state.currentMonth);

      const cards = [
        { icon: "💰", label: "Net Savings", value: formatMoney(values.net), color: "blue" },
        { icon: "💼", label: "Job Salary", value: formatMoney(values.jobSalary), color: "indigo" },
        { icon: "📈", label: "Income", value: formatMoney(values.incomeTotal), color: "green" },
        { icon: "📉", label: "Expenses", value: formatMoney(values.expenseTotal), color: "red" },
        { icon: "⚡", label: "OT Pay", value: formatMoney(values.overtimeTotal), color: "amber" }
      ];

      statsCards.innerHTML = cards.map(card => `
        <div class="stat">
          <div class="stat-icon ${card.color}">${card.icon}</div>
          <div>
            <div class="stat-label">${card.label}</div>
            <div class="stat-value">${card.value}</div>
          </div>
        </div>
      `).join("");
    }

    function renderSalaryBreakdown() {
      const values = computeValuesForMonth(state.currentMonth);
      const rows = [
        { label: "Base Salary", val: state.baseSalary, type: "normal" },
        { label: "Rent Allowance", val: state.rentAllowance, type: "income" },
        { label: "Transport Allowance", val: state.transportAllowance, type: "income" },
        { label: "Health Insurance", val: state.healthInsuranceAllowance, type: "income" },
        { label: "Overtime Pay", val: values.overtimeTotal, type: "income" },
        { label: "Absence Deductions", val: values.totalDeductions, type: "expense" },
        { label: "Calculated Salary", val: values.jobSalary, type: "total" }
      ];

      salaryBreakdown.innerHTML = rows.map(row => {
        const sign = row.type === "expense" ? "-" : row.type === "income" ? "+" : "";
        const colorClass = row.type === "income" ? "income" : row.type === "expense" ? "expense" : "total";
        const prefix = row.type === "total" ? "" : sign;
        return `
          <div class="money-row ${colorClass}">
            <span>${row.label}</span>
            <strong>${prefix}${formatMoney(row.val)}</strong>
          </div>
        `;
      }).join("");
    }

    function renderAuditInfo() {
      const values = computeValuesForMonth(state.currentMonth);
      const halfAbsences = Object.keys(state.records || {}).filter(date => date.startsWith(state.currentMonth)).filter(date => {
        const rec = state.records[date] || {};
        const d = new Date(date).getDay();
        return rec.absent && [1,2,3].includes(d);
      }).length;

      const fullAbsences = Object.keys(state.records || {}).filter(date => date.startsWith(state.currentMonth)).filter(date => {
        const rec = state.records[date] || {};
        const d = new Date(date).getDay();
        return rec.absent && [0,5,6].includes(d);
      }).length;

      const html = `
        <div class="audit-row"><span>Month FDE</span><strong>${values.totalFDE}</strong></div>
        <div class="audit-row"><span>Half day rate</span><strong>${formatMoney(values.halfRate)}</strong></div>
        <div class="audit-row"><span>Full day rate</span><strong>${formatMoney(values.fullRate)}</strong></div>
        <div class="audit-row"><span>Half absences</span><strong>${halfAbsences}</strong></div>
        <div class="audit-row"><span>Full absences</span><strong>${fullAbsences}</strong></div>
      `;
      auditInfo.innerHTML = html;
    }

    function renderCalendar() {
      const month = state.currentMonth;
      const info = monthInfo(month);
      const records = state.records || {};
      const days = [];
      for (let i = 0; i < info.firstDayIndex; i++) {
        days.push({ empty: true });
      }

      for (let d = 1; d <= info.daysInMonth; d++) {
        const date = `${month}-${String(d).padStart(2,"0")}`;
        const dayIndex = new Date(info.y, info.m - 1, d).getDay();
        const rec = records[date] || {};
        const absent = !!rec.absent;
        const overtime = Number(rec.overtime || 0);

        let cls = "calendar-day";
        let tag = "";

        if (dayIndex === 4) {
          cls += " day-off";
          tag = "Off";
        } else if (absent) {
          cls += " day-absent";
          tag = "Absent";
        } else if ([1,2,3].includes(dayIndex)) {
          cls += " day-half";
          tag = "Half";
        } else if ([0,5,6].includes(dayIndex)) {
          cls += " day-full";
          tag = "Full";
        }

        days.push({
          empty: false,
          date,
          dayIndex,
          dayNum: d,
          tag,
          absent,
          overtime,
          cls
        });
      }

      const names = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      const headerHtml = names.map(n => `<div class="day-name">${n}</div>`).join("");
      const calHtml = days.map(item => {
        if (item.empty) return `<div class="calendar-day empty"></div>`;
        const overtimeBadge = item.overtime > 0 ? `<div class="ot-badge">+${formatMoney(item.overtime).replace("NT$","")}</div>` : "";
        return `
          <button class="${item.cls}" type="button" data-date="${item.date}">
            ${overtimeBadge}
            <span class="day-number">${item.dayNum}</span>
            <span class="day-tag">${item.tag || ""}</span>
          </button>
        `;
      }).join("");

      calendarEl.innerHTML = headerHtml + calHtml;

      document.querySelectorAll(".calendar-day[data-date]").forEach(btn => {
        btn.addEventListener("click", () => openModal(btn.dataset.date));
      });
    }

    function renderTransactions() {
      const monthTx = getMonthTransactions(state.currentMonth).sort((a,b) => new Date(b.date) - new Date(a.date));
      if (!monthTx.length) {
        txList.innerHTML = `
          <div style="padding:22px;text-align:center;color:#94a3b8;font-weight:700;">
            No entries for this month yet.
          </div>
        `;
        return;
      }

      txList.innerHTML = monthTx.map(tx => {
        const isIncome = tx.type === "income";
        const sign = isIncome ? "+" : "-";
        const amountClass = isIncome ? "tx-income-text" : "tx-expense-text";
        const icon = isIncome ? "↗" : "↘";
        return `
          <div class="tx">
            <div class="tx-left">
              <div class="tx-icon ${isIncome ? "tx-income" : "tx-expense"}">${icon}</div>
              <div class="tx-info">
                <div class="tx-name">${tx.description}</div>
                <div class="tx-meta">
                  <span>${tx.category}</span>
                  <span>${tx.date}</span>
                </div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="tx-amount ${amountClass}">${sign}${formatMoney(tx.amount)}</div>
              <button type="button" class="delete-btn" data-delete="${tx.id}" aria-label="delete">×</button>
            </div>
          </div>
        `;
      }).join("");

      document.querySelectorAll("[data-delete]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-delete");
          state.transactions = state.transactions.filter(tx => tx.id !== id);
          saveState();
          renderAll();
        });
      });
    }

    function renderAll() {
      renderStats();
      renderSalaryBreakdown();
      renderAuditInfo();
      renderCalendar();
      renderTransactions();
    }

    function openModal(dateStr) {
      const modal = document.getElementById("dayModal");
      const modalDate = document.getElementById("modalDate");
      const note = document.getElementById("modalNote");
      const customAmountWrap = document.getElementById("customAmountWrap");
      const customAmountInput = document.getElementById("customAmountInput");

      modalDate.textContent = dateStr;
      const rec = state.records[dateStr] || {};
      note.textContent = "This month’s half-day and full-day rates update automatically.";

      const currentOT = Number(rec.overtime || 0);
      const info = monthInfo(state.currentMonth);

      const setCustom = () => {
        customAmountWrap.classList.add("show");
      };
      const hideCustom = () => {
        customAmountWrap.classList.remove("show");
      };

      const setActive = (otMode) => {
        document.querySelectorAll("[data-ot]").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.ot === otMode);
        });
      };

      let chosen = rec.overtime != null ? "custom" : "none";

      if (currentOT === Math.round(info.halfRate)) chosen = "half";
      if (currentOT === Math.round(info.fullRate)) chosen = "full";
      if (currentOT === 0) chosen = "none";

      setActive(chosen);

      if (chosen === "custom") {
        setCustom();
        customAmountInput.value = currentOT || "";
      } else {
        hideCustom();
      }

      document.querySelectorAll("[data-ot]").forEach(btn => {
        btn.addEventListener("click", () => {
          const mode = btn.dataset.ot;
          setActive(mode);
          if (mode === "custom") {
            setCustom();
            customAmountInput.focus();
          } else {
            hideCustom();
          }
        });
      });

      document.getElementById("markPresent").onclick = () => {
        const rec2 = state.records[dateStr] || {};
        rec2.absent = false;
        state.records[dateStr] = rec2;
        saveState();
        renderAll();
        closeModal();
      };

      document.getElementById("markAbsent").onclick = () => {
        const rec2 = state.records[dateStr] || {};
        rec2.absent = true;
        state.records[dateStr] = rec2;
        saveState();
        renderAll();
        closeModal();
      };

      document.getElementById("saveDayBtn").onclick = () => {
        const rec2 = state.records[dateStr] || {};
        const selected = document.querySelector("[data-ot].active")?.dataset.ot || "none";
        if (selected === "none") {
          rec2.overtime = 0;
        } else if (selected === "half") {
          rec2.overtime = Math.round(info.halfRate);
        } else if (selected === "full") {
          rec2.overtime = Math.round(info.fullRate);
        } else {
          rec2.overtime = Number(customAmountInput.value || 0);
        }
        state.records[dateStr] = rec2;
        saveState();
        renderAll();
        closeModal();
      };

      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      const modal = document.getElementById("dayModal");
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("dayModal").addEventListener("click", (e) => {
      if (e.target.id === "dayModal") closeModal();
    });

    monthInput.addEventListener("change", (e) => {
      state.currentMonth = e.target.value || getDefaultMonth();
      saveState();
      renderAll();
    });

    txType.addEventListener("change", populateCategories);

    txForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const desc = txDescription.value.trim();
      const amount = Number(txAmount.value);
      const date = txDate.value;

      if (!desc || !date || !amount) return;

      state.transactions.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        type: txType.value,
        category: txCategory.value,
        description: desc,
        amount: amount,
        date
      });

      saveState();
      txForm.reset();
      txType.value = "expense";
      populateCategories();
      txDate.value = new Date().toISOString().split("T")[0];
      renderAll();
    });

    function initialize() {
      monthInput.value = state.currentMonth;
      txDate.value = new Date().toISOString().split("T")[0];
      populateCategories();
      renderAll();
    }

    initialize();
  </script>
</body>
</html>
